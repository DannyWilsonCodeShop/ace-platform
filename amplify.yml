version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm install
        - npm install @rollup/rollup-linux-x64-gnu --save-optional
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .amplify/**/*
