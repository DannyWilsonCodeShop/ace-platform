version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm install
        - npm install @rollup/rollup-linux-x64-gnu --save-optional
        - node scripts/patch-outputs.js
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  customHeaders:
    - pattern: '**/*'
      headers:
        - key: Cache-Control
          value: no-cache
  cache:
    paths:
      - node_modules/**/*
      - .amplify/**/*
customRules:
  - source: '</^[^.]+$|\.(?!(css|gif|ico|jpg|js|png|txt|svg|woff|woff2|ttf|map|json)$)([^.]+$)/>'
    target: /index.html
    status: '200'
